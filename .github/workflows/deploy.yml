name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  # 手動実行も可能
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ─────────────────────────────────────────
      # 1. チェックアウト
      # ─────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ─────────────────────────────────────────
      # 2. Node.js セットアップ
      # ─────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ─────────────────────────────────────────
      # 3. 依存関係インストール
      # ─────────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ─────────────────────────────────────────
      # 4. D1 マイグレーション（本番）
      #    migrations/ 配下の未適用SQLを順番に実行
      # ─────────────────────────────────────────
      - name: Run D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 migrations apply runlens-db \
            --database-id 18a0e95a-a1f9-4c10-b875-38bdc45f738e

      # ─────────────────────────────────────────
      # 5. ビルド
      # ─────────────────────────────────────────
      - name: Build
        run: npm run build

      # ─────────────────────────────────────────
      # 6. Cloudflare Pages へデプロイ
      # ─────────────────────────────────────────
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler pages deploy dist \
            --project-name runlens \
            --branch main \
            --commit-dirty=true

      # ─────────────────────────────────────────
      # 7. デプロイ結果をサマリーに出力
      # ─────────────────────────────────────────
      - name: Summary
        if: success()
        run: |
          echo "## ✅ デプロイ完了" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **本番URL**: https://runlens.pages.dev" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
